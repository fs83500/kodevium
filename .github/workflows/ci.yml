name: CI Test Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: PHP syntax check
        run: |
          for file in $(find . -name "*.php" -not -path "./vendor/*"); do
            php -l "$file"
          done

      - name: HTML validation
        run: |
          for file in $(find . -name "*.html"); do
            if grep -q "<html" "$file" && grep -q "</html>" "$file"; then
              echo "✓ $file : structure HTML valide"
            else
              echo "✗ $file : balises <html> manquantes"
              exit 1
            fi
          done

      - name: CSS validation
        run: |
          for file in $(find . -name "*.css"); do
            if grep -q "{" "$file" && grep -q "}" "$file"; then
              echo "✓ $file : structure CSS valide"
            else
              echo "✗ $file : accolades CSS manquantes"
              exit 1
            fi
          done

      - name: File integrity check
        run: |
          echo "Vérification des fichiers présents dans le projet..."
          missing=0
          for f in index.html index.php test.css bonjour.txt; do
            if [ -f "$f" ]; then
              echo "✓ $f : présent"
            else
              echo "✗ $f : manquant"
              missing=1
            fi
          done
          exit $missing

      - name: Empty file check
        run: |
          echo "Vérification qu'aucun fichier source n'est vide..."
          for file in $(find . -name "*.html" -o -name "*.php" -o -name "*.css" | grep -v vendor); do
            if [ ! -s "$file" ]; then
              echo "✗ $file : fichier vide"
              exit 1
            fi
            echo "✓ $file : non vide"
          done

      - name: Lint workflow YAML
        run: |
          echo "Vérification de la syntaxe YAML du workflow..."
          if ! python3 -c "import yaml; yaml.safe_load(open('.github/workflows/ci.yml'))" 2>/dev/null; then
            if command -v node &>/dev/null; then
              node -e "const fs=require('fs');const s=fs.readFileSync('.github/workflows/ci.yml','utf8');if(s.includes('name:')&&s.includes('on:')&&s.includes('jobs:')){console.log('✓ Structure YAML de base présente')}else{console.log('✗ Structure YAML invalide');process.exit(1)}"
            fi
          else
            echo "✓ YAML valide (pyyaml)"
          fi

      - name: Endurance test (7 min)
        run: |
          echo "Démarrage du test d'endurance (7 minutes)..."
          DURATION=420
          INTERVAL=30
          ELAPSED=0
          while [ "$ELAPSED" -lt "$DURATION" ]; do
            REMAINING=$((DURATION - ELAPSED))
            echo "Progression : ${ELAPSED}s / ${DURATION}s (reste ${REMAINING}s) — $(date '+%H:%M:%S')"
            sleep "$INTERVAL"
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "✓ Test d'endurance terminé : 7 minutes complétées avec succès"
