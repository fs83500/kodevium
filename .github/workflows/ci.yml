name: CI Test Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: PHP syntax check
        run: |
          for file in $(find . -name "*.php" -not -path "./vendor/*"); do
            php -l "$file"
          done

      - name: HTML validation
        run: |
          for file in $(find . -name "*.html"); do
            if grep -q "<html" "$file" && grep -q "</html>" "$file"; then
              echo "✓ $file : structure HTML valide"
            else
              echo "✗ $file : balises <html> manquantes"
              exit 1
            fi
          done

      - name: CSS validation
        run: |
          for file in $(find . -name "*.css"); do
            if grep -q "{" "$file" && grep -q "}" "$file"; then
              echo "✓ $file : structure CSS valide"
            else
              echo "✗ $file : accolades CSS manquantes"
              exit 1
            fi
          done
