name: CI Test Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: PHP syntax check
        run: |
          for file in $(find . -name "*.php" -not -path "./vendor/*"); do
            php -l "$file"
          done
